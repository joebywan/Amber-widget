name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Pinned rather than ubuntu-latest: the binary needs the glibc it was built against or newer, and 24.04 matches Mint 22.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo test
      - run: cargo build --release
      # Bumping the version in Cargo.toml is what makes a release: main publishes each new version once.
      - name: Release new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          cp target/release/amber-widget amber-widget-linux-x86_64
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes \
            amber-widget-linux-x86_64 assets/icon.png assets/amber-widget.desktop
