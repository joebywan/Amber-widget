name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, file: amber-widget }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: amber-widget.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, file: amber-widget }
          - { os: macos-latest, target: x86_64-apple-darwin, file: amber-widget }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: amber-widget-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.file }}
