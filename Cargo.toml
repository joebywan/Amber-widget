[package]
name = "amber-widget"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
eframe = "0.37.0"
notify-rust = "4.18.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
ureq = { version = "3.5.0", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
